version: 2
models:
  - name: stg_sales_txn
    description: Typed raw sales. Duplicates flagged, not removed.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [store_id, date, channel, daypart, payment_type]
          config: {severity: error, name: staging_sales_txn_no_duplicate_load}
    columns:
      - {name: net_sales, tests: [not_null]}
      - {name: store_id, tests: [not_null, {relationships: {to: ref('dim_store'), field: store_id}}]}
  - name: stg_sales_lines
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [store_id, date, channel, product_id]
          config: {severity: error}
    columns:
      - {name: product_id, tests: [{relationships: {to: ref('dim_product'), field: product_id}}]}
  - name: stg_visits
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [store_id, date, channel, daypart]
          config: {severity: error}
  - name: kpi_daily
    description: Governed KPI layer; tools/metrics.py is the Python mirror.
    columns:
      - {name: store_id, tests: [not_null]}
      - {name: conversion, tests: [{dbt_utils.accepted_range: {min_value: 0, max_value: 1.5, config: {severity: warn}}}]}
