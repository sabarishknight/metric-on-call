version: 2
sources:
  - name: raw
    schema: raw
    description: Loaded exactly as the POS / web / partner feeds delivered it. Defects are real here.
    freshness:
      warn_after: {count: 1, period: day}
      error_after: {count: 2, period: day}
    loaded_at_field: "cast(date as timestamp)"
    tables:
      - {name: raw_sales_txn}
      - {name: raw_sales_lines}
      - {name: raw_visits}
      - {name: raw_load_log}
      - {name: dim_store}
      - {name: dim_product}
      - {name: ctx_promos}
      - {name: ctx_price_changes}
      - {name: ctx_ops_log}
      - {name: ctx_store_events}
      - {name: ctx_holidays}
      - {name: ctx_weather}
